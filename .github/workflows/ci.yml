name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.mjs
      - name: Validate the examples against the schema
        run: |
          npm install --no-save --no-package-lock ajv@8.17.1 ajv-formats@3.0.1
          node scripts/validate.mjs examples
