# Publishes the viewer (web/) as a static site: anyone can open a public atlas
# at https://<owner>.github.io/stackatlas/?atlas=github:owner/repo
name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Usage analytics for the hosted viewer, if the repository variable
      # POSTHOG_KEY is set (Settings → Secrets and variables → Actions →
      # Variables). Forks without it publish a viewer with no analytics.
      - name: Configure analytics
        if: ${{ vars.POSTHOG_KEY != '' }}
        env:
          KEY: ${{ vars.POSTHOG_KEY }}
          HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}
        run: |
          jq -n --arg key "$KEY" --arg host "$HOST" '{key: $key, host: $host}' > web/analytics.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
