# yaml-language-server: $schema=../../schema/stackatlas.schema.json
#
# A repository's own manifest. Put a file like this at the root of a repository
# and include it from your atlas with github:owner/repo (or gitlab:group/repo).
owner: Jane
group: Recipe Box

projects:
  - name: Website
    type: website
    url: https://example.com
    domains: [example.com]
    resources:
      - vercel/hosting
      - supabase/auth
      - supabase/database
      - use: cloudflare/r2
        notes: recipe photos

  - name: App
    type: app
    status: planned
    resources:
      - supabase/auth
      - firebase/messaging
      - google-play/store
